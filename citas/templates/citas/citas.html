{% extends "base.html" %}
{% block css %}
<style>
/* Escritorio */
.fc .fc-toolbar-title{
    font-size: 1.35rem;
}

/* Celulares */
@media (max-width:768px){

    /* La barra queda más compacta */
    .fc .fc-toolbar{
        gap: .5rem;
        margin-bottom: .75rem;
    }

    /* Botones más pequeños */
    .fc .fc-button{
        padding: .35rem .55rem;
        font-size: .8rem;
    }

    /* Título */
    .fc .fc-toolbar-title{
        font-size: 1rem;
        font-weight: 600;
    }

    /* Altura de las filas */
    .fc .fc-daygrid-day-frame{
        min-height: 65px;
    }

    /* Eventos más pequeños */
    .fc-event{
        font-size: .75rem;
        padding: 1px 2px;
    }

    /* Días de la semana */
    .fc-col-header-cell{
        font-size: .8rem;
    }

    /* Números de los días */
    .fc-daygrid-day-number{
        font-size: .85rem;
    }
}
</style>
{% endblock css %}
{% block content %}
<div id="calendar"></div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const esMovil = window.matchMedia("(max-width: 768px)").matches;

    const calendar = new FullCalendar.Calendar(
        document.getElementById("calendar"),
        {
            initialView: "listWeek",
            locale: "es",
            height: "auto",
            expandRows: true,
            stickyHeaderDates: true,

            customButtons: {
                nuevaCita: {
                    text: esMovil ? "+" : "Agendar",
                    click: function () {
                        window.location.href = "{% url 'citas:agendar' %}";
                    }
                }
            },

            headerToolbar: esMovil
                ? {
                    left: "prev,next",
                    center: "title",
                    right: "nuevaCita"
                }
                : {
                    left: "prev,next today nuevaCita",
                    center: "title",
                    right: "dayGridWeek listWeek"
                },

            buttonText: {
                today: "Actual",
                dayGridWeek: "Vertical",
                listWeek: "Horizontal"
            },

            events: {
                url: "{% url 'citas:citas_json' %}",
                method: "GET"
            }
        }
    );

    calendar.render();

});
</script>
{% endblock %}
